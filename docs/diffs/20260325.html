        let currentViewMode = 'split';

        function setViewMode(mode) {
            currentViewMode = mode;
            const container = document.getElementById('viewContainer');
            const btnSplit = document.getElementById('btnSplit');
            const btnTabs = document.getElementById('btnTabs');
            const panelOld = document.getElementById('panelOld');
            const panelNew = document.getElementById('panelNew');

            container.className = `container view-mode-${mode}`;

            if (mode === 'split') {
                btnSplit.classList.add('active');
                btnTabs.classList.remove('active');
                panelOld.classList.remove('hidden');
                panelNew.classList.remove('hidden');
            } else {
                btnSplit.classList.remove('active');
                btnTabs.classList.add('active');
                panelOld.classList.remove('hidden');
                panelNew.classList.add('hidden');
            }
        }

        function toggleDiffSection() {
            const section = document.getElementById('diffSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        let syncScrollEnabled = true;
        let isScrolling = false;

        function loadPreviews() {
            const frameOld = document.getElementById('frameOld');
            const frameNew = document.getElementById('frameNew');

            // Load snapshots into iframes
            frameOld.src = `../snapshots/${config.prevDate}.html`;
            frameNew.src = `../snapshots/${config.date}.html`;

            // Setup scroll sync and fix base URL after iframes load
            frameOld.addEventListener('load', () => {
                fixIframeBasePath(frameOld);
                setupScrollSync(frameOld, frameNew);
            });
            frameNew.addEventListener('load', () => {
                fixIframeBasePath(frameNew);
                setupScrollSync(frameNew, frameOld);
            });
        }

        function fixIframeBasePath(iframe) {
            // Fix relative paths in iframe by adding base element
            try {
                const iframeDoc = iframe.contentWindow.document;
                if (iframeDoc && iframeDoc.head) {
                    // Check if base element already exists
                    let baseElement = iframeDoc.querySelector('base');
                    if (!baseElement) {
                        baseElement = iframeDoc.createElement('base');
                        // Set base href to the snapshot directory
                        baseElement.href = window.location.origin + window.location.pathname.replace(/diffs\/[^/]+$/, 'snapshots/');
                        iframeDoc.head.insertBefore(baseElement, iframeDoc.head.firstChild);
                    }

                    // Inject CSS for highlighting into iframe
                    injectHighlightCSS(iframeDoc);
                }
            } catch (e) {
                console.warn('Could not fix iframe base path:', e);
            }
        }

        function injectHighlightCSS(iframeDoc) {
            // Inject CSS styles for highlighting directly into iframe
            const styleId = 'highlight-styles';

            // Check if already injected
            if (iframeDoc.getElementById(styleId)) {
                return;
            }

            const styleElement = iframeDoc.createElement('style');
            styleElement.id = styleId;
            styleElement.textContent = `
                /* Highlight styles injected for change detection - background only */
                .change-highlight-added,
                .change-highlight-added * {
                    background-color: #d4edda !important;
                }

                .change-highlight-added {
                    transition: background-color 0.3s ease !important;
                }

                .change-highlight-deleted,
                .change-highlight-deleted * {
                    background-color: #f8d7da !important;
                }

                .change-highlight-deleted {
                    transition: background-color 0.3s ease !important;
                }

                .change-highlight-modified,
                .change-highlight-modified * {
                    background-color: #fff3cd !important;
                }

                .change-highlight-modified {
                    transition: background-color 0.3s ease !important;
                }

                .change-highlight-flash-added {
                    animation: flashHighlightAdded 0.5s ease;
                }

                .change-highlight-flash-deleted {
                    animation: flashHighlightDeleted 0.5s ease;
                }

                .change-highlight-flash-modified {
                    animation: flashHighlightModified 0.5s ease;
                }

                @keyframes flashHighlightAdded {
                    0%, 100% { background-color: #d4edda; }
                    50% { background-color: #a3d9a5; }
                }

                @keyframes flashHighlightDeleted {
                    0%, 100% { background-color: #f8d7da; }
                    50% { background-color: #f5b7b1; }
                }

                @keyframes flashHighlightModified {
                    0%, 100% { background-color: #fff3cd; }
                    50% { background-color: #ffe082; }
                }
            `;

            iframeDoc.head.appendChild(styleElement);
            console.log('Injected highlight CSS into iframe');
        }

        function setupScrollSync(sourceFrame, targetFrame) {
            try {
                const sourceDoc = sourceFrame.contentWindow;
                sourceDoc.addEventListener('scroll', () => {
                    if (!syncScrollEnabled || isScrolling) return;
                    isScrolling = true;

                    try {
                        const sourceScrollTop = sourceDoc.scrollY || sourceDoc.document.documentElement.scrollTop;
                        const sourceScrollHeight = sourceDoc.document.documentElement.scrollHeight - sourceDoc.innerHeight;
                        const scrollPercentage = sourceScrollHeight > 0 ? sourceScrollTop / sourceScrollHeight : 0;

                        const targetDoc = targetFrame.contentWindow;
                        const targetScrollHeight = targetDoc.document.documentElement.scrollHeight - targetDoc.innerHeight;
                        const targetScrollTop = scrollPercentage * targetScrollHeight;

                        targetDoc.scrollTo({
                            top: targetScrollTop,
                            behavior: 'auto'
                        });
                    } catch (e) {
                        console.error('Scroll sync error:', e);
                    }

                    setTimeout(() => { isScrolling = false; }, 50);
                });
            } catch (e) {
                console.error('Failed to setup scroll sync:', e);
            }
        }

        function toggleScrollSync() {
            syncScrollEnabled = !syncScrollEnabled;
            const btn = document.getElementById('scrollSyncBtn');
            if (btn) {
                btn.textContent = syncScrollEnabled ? '🔗 Scroll Sync: ON' : '🔓 Scroll Sync: OFF';
                btn.style.background = syncScrollEnabled ? '#28a745' : '#6c757d';
            }
        }

        function loadDiff() {
            const diffContent = document.getElementById('diffContent');

            if (config.diffContent) {
                // Parse and format diff with color highlighting
                const lines = config.diffContent.split('\n');
                let formattedHtml = '<div style="font-family: monospace; font-size: 13px; line-height: 1.6;">';

                lines.forEach(line => {
                    let color = '';
                    let backgroundColor = '';
                    let fontWeight = 'normal';

                    if (line.startsWith('+++') || line.startsWith('---')) {
                        color = '#666';
                        fontWeight = 'bold';
                    } else if (line.startsWith('+')) {
                        color = '#22863a';
                        backgroundColor = '#f0fff4';
                        fontWeight = '600';
                    } else if (line.startsWith('-')) {
                        color = '#d73a49';
                        backgroundColor = '#ffeef0';
                        fontWeight = '600';
                    } else if (line.startsWith('@@')) {
                        color = '#0366d6';
                        backgroundColor = '#e3f2fd';
                        fontWeight = 'bold';
                    }

                    const escapedLine = escapeHtml(line || ' ');
                    formattedHtml += `<div style="color: ${color}; background: ${backgroundColor}; padding: 2px 8px; font-weight: ${fontWeight};">${escapedLine}</div>`;
                });

                formattedHtml += '</div>';
                diffContent.innerHTML = formattedHtml;
            } else {
                diffContent.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">Diff data not available for this view mode. Please use the generated diff viewer page.</p>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

                    // If this is an addition (deletions = 0), highlight the entire preview
                    if (change.deletions === 0 && change.additions > 0) {
                        previewHtml = `<div class="change-item-preview"><span style="background-color: #d4edda; padding: 2px 4px; border-radius: 3px;">${escapedPreview}</span></div>`;
                    } else {
                        previewHtml = `<div class="change-item-preview">${escapedPreview}</div>`;
                    }
                }

                html += `
                    <div class="change-item" onclick="jumpToChange(${index}, ${anchorParam})">
                        <div class="change-item-header">
                            <span class="change-item-section">${escapeHtml(change.section || '不明なセクション')}</span>
                            <span class="change-item-type">${escapeHtml(change.type)}</span>
                            <span class="change-item-stats">+${change.additions} -${change.deletions}</span>
                        </div>
                        ${previewHtml}
                    </div>
                `;
            });

            summaryList.innerHTML = html;
        }

        let currentHighlightedElements = [];

        function jumpToChange(changeIndex, anchorId) {
            console.log('jumpToChange called:', changeIndex, anchorId);

            const frameOld = document.getElementById('frameOld');
            const frameNew = document.getElementById('frameNew');

            if (!frameOld || !frameNew || !frameOld.contentWindow || !frameNew.contentWindow) {
                console.error('Could not access iframes');
                return;
            }

            const change = config.changeSummary[changeIndex];
            console.log('Change data:', change);

            try {
                // Clear previous highlights
                currentHighlightedElements.forEach(el => {
                    el.classList.remove('change-highlight-added');
                    el.classList.remove('change-highlight-deleted');
                    el.classList.remove('change-highlight-modified');
                    el.classList.remove('change-highlight-flash-added');
                    el.classList.remove('change-highlight-flash-deleted');
                    el.classList.remove('change-highlight-flash-modified');
                });
                currentHighlightedElements = [];

                // Determine change type
                const changeType = determineChangeType(change.type);
                console.log('Change type determined:', changeType);

                if (anchorId) {
                    // Navigate both iframes to anchor
                    const targetUrlNew = `../snapshots/${config.date}.html#${anchorId}`;
                    const targetUrlOld = `../snapshots/${config.prevDate}.html#${anchorId}`;

                    frameNew.contentWindow.location.href = targetUrlNew;
                    frameOld.contentWindow.location.href = targetUrlOld;

                    // Wait for navigation and then highlight
                    setTimeout(() => {
                        // Scroll panels into view
                        const panelOld = document.getElementById('panelOld');
                        if (panelOld) {
                            panelOld.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }

                        // Highlight based on change type
                        if (changeType === 'added') {
                            // Green highlight in NEW only
                            highlightChangedContent(frameNew, anchorId, change, 'added');
                        } else if (changeType === 'deleted') {
                            // Red highlight in OLD only
                            highlightChangedContent(frameOld, anchorId, change, 'deleted');
                        } else if (changeType === 'modified') {
                            // Yellow highlight in both
                            highlightChangedContent(frameOld, anchorId, change, 'modified');
                            highlightChangedContent(frameNew, anchorId, change, 'modified');
                        }
                    }, 500);
                } else {
                    // Fallback: scroll panels into view
                    const panelOld = document.getElementById('panelOld');
                    if (panelOld) {
                        panelOld.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            } catch (e) {
                console.error('Failed to jump to change:', e);
            }
        }

        function determineChangeType(typeString) {
            // Determine if it's added, deleted, or modified based on type string
            if (typeString.includes('追加:') || typeString.includes('追加：')) {
                return 'added';
            } else if (typeString.includes('削除:') || typeString.includes('削除：')) {
                return 'deleted';
            } else if (typeString.includes('変更:') || typeString.includes('変更：')) {
                return 'modified';
            }
            return 'modified'; // Default
        }

        function highlightChangedContent(iframe, anchorId, change, highlightType) {
            // Find and highlight the specific changed content
            console.log('highlightChangedContent called:', iframe.id, anchorId, highlightType);
            try {
                const iframeDoc = iframe.contentWindow.document;
                const sectionElement = iframeDoc.getElementById(anchorId);

                if (!sectionElement) {
                    console.warn('Section element not found:', anchorId);
                    return;
                }
                console.log('Section element found:', sectionElement);

                // Find the element containing the changed text
                let targetElement = null;

                if (change.preview && change.preview.length > 5) {
                    // For modified changes, extract the relevant part
                    let searchText = change.preview;
                    if (change.preview.includes('[旧]') && change.preview.includes('[新]')) {
                        // This is a modification, extract the appropriate part
                        if (highlightType === 'deleted' || iframe.id === 'frameOld') {
                            // Extract old text: [旧] ... →
                            const oldMatch = searchText.match(/\[旧\]\s*(.+?)\s*→/);
                            if (oldMatch) searchText = oldMatch[1];
                        } else {
                            // Extract new text: → [新] ...
                            const newMatch = searchText.match(/→\s*\[新\]\s*(.+)/);
                            if (newMatch) searchText = newMatch[1];
                        }
                    }

                    const previewText = searchText.substring(0, 50); // First 50 chars

                    // IMPORTANT: Search based on html_element type
                    if (change.html_element === 'content') {
                        // For heading/content changes, find the heading element itself
                        // Search for h3 or h4 elements near the section
                        const headings = sectionElement.parentElement.querySelectorAll('h3, h4');
                        for (let heading of headings) {
                            const headingText = heading.textContent.toLowerCase().replace(/\s+/g, ' ').trim();
                            const searchLower = previewText.toLowerCase().replace(/\s+/g, ' ').trim();
                            if (headingText.includes(searchLower)) {
                                targetElement = heading;
                                break;
                            }
                        }
                    } else if (change.html_element === 'table_row') {
                        // For table row changes, find the specific <tr> element
                        let sectionEnd = null;
                        let nextHeading = sectionElement.nextElementSibling;
                        while (nextHeading) {
                            if (nextHeading.tagName && nextHeading.tagName.match(/^H[1-4]$/)) {
                                sectionEnd = nextHeading;
                                break;
                            }
                            nextHeading = nextHeading.nextElementSibling;
                        }
                        targetElement = findTableRowInRange(sectionElement, sectionEnd, previewText);
                    } else if (change.html_element === 'paragraph') {
                        // For paragraph changes, find the specific <p> or .admonition element
                        let sectionEnd = null;
                        let nextHeading = sectionElement.nextElementSibling;
                        while (nextHeading) {
                            if (nextHeading.tagName && nextHeading.tagName.match(/^H[1-4]$/)) {
                                sectionEnd = nextHeading;
                                break;
                            }
                            nextHeading = nextHeading.nextElementSibling;
                        }
                        targetElement = findParagraphInRange(sectionElement, sectionEnd, previewText);
                    } else {
                        // Fallback: use general search within section bounds
                        let sectionEnd = null;
                        let nextHeading = sectionElement.nextElementSibling;
                        while (nextHeading) {
                            if (nextHeading.tagName && nextHeading.tagName.match(/^H[1-4]$/)) {
                                sectionEnd = nextHeading;
                                break;
                            }
                            nextHeading = nextHeading.nextElementSibling;
                        }
                        targetElement = findElementWithTextInRange(sectionElement, sectionEnd, previewText);
                    }

                    if (!targetElement) {
                        // Fallback: search from section element
                        targetElement = findElementWithText(sectionElement, previewText);
                    }
                }

                if (!targetElement) {
                    // Final fallback: highlight the section element itself
                    targetElement = sectionElement;
                }

                console.log('Target element for highlight:', targetElement);

                // Apply persistent highlight with color based on type
                const highlightClass = `change-highlight-${highlightType}`;
                const flashClass = `change-highlight-flash-${highlightType}`;

                targetElement.classList.add(highlightClass);
                targetElement.classList.add(flashClass);

                // Store reference for later removal
                currentHighlightedElements.push(targetElement);

                // Scroll to the highlighted element
                targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

            } catch (e) {
                console.error('Could not highlight content:', e);
            }
        }

        function findElementWithTextInRange(startElement, endElement, searchText) {
            // Search for text only within the range from startElement to endElement
            const normalizedSearch = searchText.toLowerCase().replace(/\s+/g, ' ').trim();
            let currentElement = startElement.nextElementSibling;

            while (currentElement && currentElement !== endElement) {
                const elementText = currentElement.textContent.toLowerCase().replace(/\s+/g, ' ').trim();

                if (elementText.includes(normalizedSearch)) {
                    // Search within this element
                    const found = findElementWithText(currentElement, searchText);
                    if (found) return found;
                }

                currentElement = currentElement.nextElementSibling;
            }

            return null;
        }

        function findElementWithText(rootElement, searchText) {
            // Recursively search for element containing the text
            const normalizedSearch = searchText.toLowerCase().replace(/\s+/g, ' ').trim();

            function searchInElement(element) {
                // Check if this element's text content contains the search text
                const elementText = element.textContent.toLowerCase().replace(/\s+/g, ' ').trim();

                if (elementText.includes(normalizedSearch)) {
                    // If this is a leaf element (or small element), return it
                    if (element.children.length === 0 || elementText.length < 200) {
                        return element;
                    }

                    // Otherwise, search in children
                    for (let child of element.children) {
                        const found = searchInElement(child);
                        if (found) return found;
                    }

                    // If no child matched, return this element
                    return element;
                }

                return null;
            }

            return searchInElement(rootElement);
        }

        function findTableRowInRange(startElement, endElement, searchText) {
            // Find a specific <tr> element containing the search text
            const normalizedSearch = searchText.toLowerCase().replace(/\s+/g, ' ').trim();
            let currentElement = startElement.nextElementSibling;

            while (currentElement && currentElement !== endElement) {
                // Look for table elements
                if (currentElement.tagName === 'TABLE') {
                    const rows = currentElement.querySelectorAll('tr');
                    for (let row of rows) {
                        const rowText = row.textContent.toLowerCase().replace(/\s+/g, ' ').trim();
                        if (rowText.includes(normalizedSearch)) {
                            return row;
                        }
                    }
                }
                currentElement = currentElement.nextElementSibling;
            }
            return null;
        }

        function findParagraphInRange(startElement, endElement, searchText) {
            // Find a specific <p> element containing the search text
            // Prefer inner <p> over container elements like .admonition
            const normalizedSearch = searchText.toLowerCase().replace(/\s+/g, ' ').trim();
            let currentElement = startElement.nextElementSibling;

            while (currentElement && currentElement !== endElement) {
                const elementText = currentElement.textContent.toLowerCase().replace(/\s+/g, ' ').trim();

                // Check if this element matches
                if (elementText.includes(normalizedSearch)) {
                    // First, try to find a <p> element within this element
                    const paragraphs = currentElement.querySelectorAll('p');
                    for (let p of paragraphs) {
                        const pText = p.textContent.toLowerCase().replace(/\s+/g, ' ').trim();
                        if (pText.includes(normalizedSearch)) {
                            return p;
                        }
                    }

                    // If this element itself is a <p>, return it
                    if (currentElement.tagName === 'P') {
                        return currentElement;
                    }

                    // Last resort: return the container
                    return currentElement;
                }

                currentElement = currentElement.nextElementSibling;
            }
            return null;
        }

        function loadMetaInfo() {
            const metaInfo = document.getElementById('metaInfo');
            metaInfo.textContent = `Date: ${config.date} | Previous: ${config.prevDate}`;

            const summaryStats = document.getElementById('summaryStats');
            summaryStats.innerHTML = `
                <div class="stat-box">
                    <div class="label">Date</div>
                    <div class="value">${config.date}</div>
                </div>
                <div class="stat-box" style="border-color: #22863a">
                    <div class="label">Additions</div>
                    <div class="value" style="color: #22863a">+${config.additions}</div>
                </div>
                <div class="stat-box" style="border-color: #d73a49">
                    <div class="label">Deletions</div>
                    <div class="value" style="color: #d73a49">-${config.deletions}</div>
                </div>
            `;
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            loadMetaInfo();
            loadPreviews();
            loadDiff();
            loadChangeSummary();
        });
    </script>
</body>
